news:
  title: News
  description: |
     Get our updates here!   
  features:
    - title: National dissemination webinar on biodiversity data mobilisation in Pakistan [*04 Nov 2025*]
      description: |
        We invite you to join the virtual webinar on biodiversity data mobilisation in Pakistan. The webinar aims to share the information in the global biodiversity database, GBIF. See <a href="https://hindu-kush.hp.gbif-staging.org/news_updates">more</a>
      href: https://hindu-kush.hp.gbif-staging.org/news_updates
      background: /assets/images/logos/ICIMOD Symbol-Blue.png
      #imageLicense: Ramesh Kathariya, ICIMOD
      cta:
      - text: Event call
        href: https://hindu-kush.hp.gbif-staging.org/news_updates
        isPrimary: false
      - text: Report
        href: /post/Webinar-on-biodiversity-data-mobilisation-in-Pakistan
        isPrimary: true   
      categories: [ICIMOD, GBIF, Khyber Pakhtunkhwa Forest Department]
# NEPAL NATIONAL CONSULTATION    
    - title: Enhancing biodiversity data mobilisation from Nepal - Nepal [*31 Aug - 01 Sep 2025*]
      description: |
        This two-day national consultation will bring together government agencies responsible for biodiversity conservation and management, biodiversity experts, academia, and national herbaria and museums to discuss Nepal’s capacity for open-access biodiversity data mobilisation, as well as the opportunities and challenges associated with it. See <a href="https://www.icimod.org/event/landscapes/enhancing-biodiversity-data-mobilisation-from-nepal/">more</a>
      href: https://www.icimod.org/event/landscapes/enhancing-biodiversity-data-mobilisation-from-nepal/
      background: /assets/images/news_updates/Nepal_Nat_Cons.jpg
      #imageLicense: Ramesh Kathariya, ICIMOD
      cta:
      - text: Event call
        href: https://www.icimod.org/event/landscapes/enhancing-biodiversity-data-mobilisation-from-nepal/
        isPrimary: false
      - text: Report
        href: /post/National-consultation-on-enhancing-biodiversity-data-mobilisation-from-Nepal
        isPrimary: true
      categories: [ICIMOD, GBIF, ForestAction Nepal]
#BANGLADESH NATIONAL CONSULTATION
    - title: National Dissemination Webinar on Open Access Biodiversity Data Publishing in Bangladesh, [*4 Sep 2025*]
      description: |
        Join us for the webinar on sharing experiences and raising awareness about biodiversity data mobilisation in Bangladesh. The webinar aims to sensitise participants and also showcase the importance of sharing data. See <a href="https://eqms.com.bd/our-events/12/National%20Dissemination%20Webinar%20on%20Open%20Access%20Biodiversity%20Data%20Publishing%20in%20Bangladeshc">more</a>
      href: https://eqms.com.bd/public/our-events/12/National%20Dissemination%20Webinar%20on%20Open%20Access%20Biodiversity%20Data%20Publishing%20in%20Bangladesh
      background: /assets/images/news_updates/Call4webinar-Bangladesh-03.09.2025.png
      #imageLicense: Ramesh Kathariya, ICIMOD
      cta:
      - text: Event Call
        href: https://eqms.com.bd/public/our-events/12/National%20Dissemination%20Webinar%20on%20Open%20Access%20Biodiversity%20Data%20Publishing%20in%20Bangladesh
        isPrimary: false
      - text: Report
        href: /post/Webinar-on-biodiversity-data-mobilisation-in-Bangladesh
        isPrimary: true
      categories: [ICIMOD, GBIF, Noakhali Science and Technology University, EQMS Consulting Limited]

#INDIA NATIONAL CONSULTATION
    - title: Webinar on Biodiversity Data Mobilisation and Publishing - India [*4 Sep 2025*]
      description: |
        This webinar aims to sensitise participants to the challenges of biodiversity data availability, introduce tools and best practices for data mobilisation, and demonstrate how contributions from biodiversity hotspots, such as India, can inform global conservation efforts. See <a href="https://www.atree.org/atree_events/webinar-gbif/">more</a>
      href: https://www.atree.org/atree_events/webinar-gbif/
      background: /assets/images/news_updates/Call4Webinar-India-28-08-2025.jpeg
      #imageLicense: Ramesh Kathariya, ICIMOD
      cta:
      - text: Event call
        href: https://www.atree.org/atree_events/webinar-gbif/
        isPrimary: false
      - text: Report
        href: /post/Webinar-on-biodiversity-data-mobilisation-in-India
        isPrimary: true
      categories: [ICIMOD, GBIF, ATREE India]

