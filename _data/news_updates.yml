news:
  title: News
  description: |
     Get our updates here!   
  features:
    - title: Enhancing biodiversity data mobilisation from Nepal - Nepal [*31 Aug - 01 Sep 2025*]
      description: |
        This two-day national consultation will bring together government agencies responsible for biodiversity conservation and management, biodiversity experts, academia, and national herbaria and museums to discuss Nepal’s capacity for open access biodiversity data mobilisation, and the opportunities and challenges to do so. See <a href="https://www.icimod.org/event/landscapes/enhancing-biodiversity-data-mobilisation-from-nepal/">more</a>
      background: /assets/images/news_updates/Nepal_Nat_Cons.jpg
      #imageLicense: Ramesh Kathariya, ICIMOD
      categories: [ICIMOD, GBIF, ForestAction Nepal]
      
     - title: Webinar on biodiversity data mobilisation - Bangladesh [*4 Sep 2025*]
      description: |
        Join us for the webinar on experience sharing and awareness on biodiversity data mobilisation in Bangladesh. The webinar aims to sensitise participants and also showcase the importance of sharing data. See <a href="https://hindu-kush.hp.gbif-staging.org/news_updates">more</a>
      background: /assets/images/logos/ICIMOD Symbol-Blue.png
      #imageLicense: Ramesh Kathariya, ICIMOD
      categories: [ICIMOD, GBIF]
      

 
    - title: Webinar on Biodiversity Data Mobilisation and Publishing - India [*4 Sep 2025*]
      description: |
        This webinar aims to sensitise participants to the challenges of biodiversity data availability, introduce tools and best practices for data mobilisation, and demonstrate how contributions from biodiversity hotspots, such as India, can inform global conservation efforts. See <a href="https://www.atree.org/atree_events/webinar-gbif/">more</a>
      background: /assets/images/news_updates/Call4Webinar-India-28-08-2025.jpeg
      #imageLicense: Ramesh Kathariya, ICIMOD
      categories: [ICIMOD, GBIF, ATREE India]

      
    - title: Webinar on Biodiversity Data Mobilisation and Publishing - Bhutan [*05 Aug 2025*] # required
      description: |      # required
        Join us for a webinar on Biodiversity Data Mobilisation and Training on 05 August 2025, jointly organised by the *National Biodiversity Centre* and the *National Mushroom Centre*, Bhutan, in collaboration with the *ICIMOD* and *GBIF*: The Global Biodiversity Information Facility. See <a href="https://www.facebook.com/share/p/1CfAXca64o/">more</a>
      href: https://nbc.gov.bt/announcements/upcoming-webinar-biodiversity-data-mobilisation-and-publishing/
      # img required
      background: /assets/images/news_updates/Call4webinar-Bhutan-05.08.2025.jpg
      #imageLicense: Ramesh Kathariya, ICIMOD
      categories: [ICIMOD, GBIF, National Biodiversity Centre - Bhutan, National Mushroom Centre - Bhutan] # optional
         
    - title: Regional Training on Biodiversity Data Mobilisation *[19 - 21 May 2025]* # required
      description: |      # required
         Enhancing institutional capacity for biodiversity data management in the Hindu Kush Himalaya using the *Global Biodiversity Information Facility’s* Open Access Platform. See <a href="https://www.icimod.org/event/ecosystems-landscapes/regional-institutional-capacity-building-for-biodiversity-data-mobilisation-and-management/">more</a>
      href: https://www.icimod.org/event/ecosystems-landscapes/regional-institutional-capacity-building-for-biodiversity-data-mobilisation-and-management/
      # img required
      background: /assets/images/news_updates/RgTraining.JPG
      imageLicense: Ramesh Kathariya, ICIMOD
      categories: [ICIMOD, GBIF, National Biodiversity Centre Bhutan, Zoological Survey of India, National Science Library CAS China, Forest Action Nepal] # optional




resources:
  title: Resources
  description: |
     
  features:
    - title: Biodiversity data in the Hindu Kush Himalaya from the GBIF database # required
      description: |      # required
        Join us for a webinar on Biodiversity Data Mobilisation and Training on 05 August 2025, jointly organised by the *National Biodiversity Centre* and the *National Mushroom Centre*, Bhutan, in collaboration with the *ICIMOD* and *GBIF*: The Global Biodiversity Information Facility. See <a href="https://www.facebook.com/share/p/1CfAXca64o/">more</a>
      href: https://lib.icimod.org/records/knyz0-jxk77
      # img required
      background: /assets/images/news_updates/BiodiversirtydataPoster.jpg
      #imageLicense: Ramesh Kathariya, ICIMOD
      categories: [ICIMOD, GBIF] # optional

    - title: Unlocking Biodiversity Data for Sustainable Development in the Hindu Kush Himalaya # required
      description: |      # required
        Open-access biodiversity data platforms, such as *GBIF* and *HKHBIF*, are transforming conservation in the Hindu Kush Himalaya, supporting global biodiversity goals – including the *KMGBF* and the *SDGs*. See <a href = "https://blog.icimod.org/resilient-economies-landscapes/biodiversity-data-hindu-kush-himalaya/">more<a/>
      href: https://blog.icimod.org/resilient-economies-landscapes/biodiversity-data-hindu-kush-himalaya/
      # img required
      background: /assets/images/news_updates/Lichen.05.08.2025.jpg
      imageLicense: Ramesh Kathariya, ICIMOD
      categories: ICIMOD, Sasha Sunuwar, Bandana Shakya, Ramesh Kathariya] # optional

    - title: Flora of Kailash Sacred Landscape Nepal - An Annotated Checklist. Volume 1 # required
      description: |      # required
        Kailash Sacred Landscape (KSL) is a transboundary landscape with rich ecological and biological diversity. This publication is the first volume of the three-volume book, documenting the gymnosperm and angiosperm flora of KSL in north-west Nepal. Learn <a href="https://lib.icimod.org/records/wh2xh-nsp87">more<a/>
      href: https://lib.icimod.org/records/wh2xh-nsp87
      # img required
      background: /assets/images/news_updates/floraofKSL.png
      #imageLicense: Ramesh Kathariya, ICIMOD
      categories: [Tribhuvan University] # optional

    - title: Pictorial Handbook on Flowers of Sikkim’ Vol-I # required
      description: |      # required
        An effort was made to document the rich floral biodiversity in the form of the *“Pictorial Handbook on Flowers of Sikkim”*, which includes 376 species of common occurrence flowers as well as rare, endangered and endemic flowering plants. For details, please contact <a href="mailto:pg_yuksam@yahoo.com">Mr Pema Bhutia</a>
      href: https://www.nhbs.com/pictorial-handbook-on-flowers-of-sikkim-volume-1
      # img required
      background: /assets/images/news_updates/handbookofFlowersofSikkim.png
      #imageLicense: Ramesh Kathariya, ICIMOD
      #categories: [Tribhuvan University] # optional


