resources:
  title: Resources
  description: |
     
  features:
    - title: Biodiversity data in the Hindu Kush Himalaya from the GBIF database # required
      description: |      # required
        Join us for a webinar on Biodiversity Data Mobilisation and Training on 05 August 2025, jointly organised by the *National Biodiversity Centre* and the *National Mushroom Centre*, Bhutan, in collaboration with the *ICIMOD* and *GBIF*: The Global Biodiversity Information Facility. See <a href="https://www.facebook.com/share/p/1CfAXca64o/">more</a>
      href: https://lib.icimod.org/records/knyz0-jxk77
      # img required
      background: /assets/images/news_updates/BiodiversirtydataPoster.jpg
      #imageLicense: Ramesh Kathariya, ICIMOD
      categories: [ICIMOD, GBIF] # optional

    - title: Unlocking Biodiversity Data for Sustainable Development in the Hindu Kush Himalaya # required
      description: |      # required
        Open-access biodiversity data platforms, such as *GBIF* and *HKHBIF*, are transforming conservation in the Hindu Kush Himalaya, supporting global biodiversity goals – including the *KMGBF* and the *SDGs*. See <a href = "https://blog.icimod.org/resilient-economies-landscapes/biodiversity-data-hindu-kush-himalaya/">more<a/>
      href: https://blog.icimod.org/resilient-economies-landscapes/biodiversity-data-hindu-kush-himalaya/
      # img required
      background: /assets/images/news_updates/Lichen.05.08.2025.jpg
      imageLicense: Ramesh Kathariya, ICIMOD
      categories: [ICIMOD, Sasha Sunuwar, Bandana Shakya, Ramesh Kathariya] # optional

    - title: Flora of Kailash Sacred Landscape Nepal - An Annotated Checklist. Volume 1 # required
      description: |      # required
        Kailash Sacred Landscape (KSL) is a transboundary landscape with rich ecological and biological diversity. This publication is the first volume of the three-volume book, documenting the gymnosperm and angiosperm flora of KSL in north-west Nepal. Learn <a href="https://lib.icimod.org/records/wh2xh-nsp87">more<a/>
      href: https://lib.icimod.org/records/wh2xh-nsp87
      # img required
      background: /assets/images/news_updates/floraofKSL.png
      #imageLicense: Ramesh Kathariya, ICIMOD
      categories: [Tribhuvan University] # optional

    - title: Pictorial Handbook on Flowers of Sikkim’ Vol-I # required
      description: |      # required
        An effort was made to document the rich floral biodiversity in the form of the *“Pictorial Handbook on Flowers of Sikkim”*, which includes 376 species of common occurrence flowers as well as rare, endangered and endemic flowering plants. For details, please contact <a href="mailto:pg_yuksam@yahoo.com">Mr Pema Bhutia</a>
      href: https://www.nhbs.com/pictorial-handbook-on-flowers-of-sikkim-volume-1
      # img required
      background: /assets/images/news_updates/handbookofFlowersofSikkim.png
      #imageLicense: Ramesh Kathariya, ICIMOD
      #categories: [Tribhuvan University] # optional


