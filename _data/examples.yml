AboutHKHBIF:
  reverse: false
  title: "About HKHBIF"
  description: |      # required
    The Hindu Kush Himalayan Biodiversity Information Facility (HKHBIF), hosted by ICIMOD, is a regional platform that mobilises, integrates, and publishes biodiversity data from across the Hindu Kush Himalaya. As an associate node of the Global Biodiversity Information Facility (GBIF), HKHBIF connects researchers, academic institutions, government agencies, conservation organisations, and citizen scientists across the eight countries of the region. It enables them to share species occurrence records, ecological observations, and other biodiversity datasets in formats that are standardised, citable, and accessible to users worldwide.

    HKHBIF is building a regional network of data holders and contributors while encouraging a culture of open and responsible biodiversity data sharing. It also strengthens institutional and individual capacity in biodiversity data management, data publishing, quality assurance, and the use of open data for research and decision-making.

    By bringing together biodiversity information that is often scattered across institutions, research projects, and national systems, HKHBIF helps address major knowledge gaps in one of the world’s most biodiverse yet underrepresented regions. The data made available through the platform can support scientific research, conservation planning, environmental assessment, policy development, and progress towards national and global biodiversity targets.
        
  # img required
  background: https://inaturalist-open-data.s3.amazonaws.com/photos/673922108/large.jpg
  imageLicense: CC BY-NC 4.0
  cta:
  - text: Explore datasets
    href: /collection/search
    isPrimary: true

becomePublisher:
  reverse: true
  title: "Be a publisher!"
  description: |
    Help shape the future of biodiversity conservation in the Hindu Kush Himalaya by publishing your data with HKHBIF. Whether you’re a researcher, institution, or citizen scientist, your records and observations can inform science, policy, and sustainable development across the region.
    
    Publishing through HKHBIF makes your data globally visible, citable, and integrated into platforms like GBIF—filling critical gaps to support habitat modelling, climate planning, and ecosystem assessments.
    
    Join a growing network of contributors working to make biodiversity data open, accessible, and impactful. Your data matters: *share it, cite it, and let it drive change*.
  
  background: https://inaturalist-open-data.s3.amazonaws.com/photos/708196631/large.jpg
  imageLicense: CC BY-NC 4.0
  cta:
  - text:  Start Publishing
    href: https://www.gbif.org/become-a-publisher
    isPrimary: true
