teamSection:
  title: Meet Our Team
  description: |
    Our dedicated team is working together to enhance biodiversity data sharing and conservation efforts in the HKH region.
  features:
    - title: Pema Gyamtsho
      description: Director General, ICIMOD (Head of Delegation)
      background: /assets/images/pema_gyamtsho.jpg
      details:
        bio: Dr. Pema Gyamtsho leads ICIMOD with a vision to enhance regional cooperation and sustainable development in the Hindu Kush Himalaya. He has a strong background in natural resource management and policy advocacy.
        expertise: Sustainable development, natural resource management, regional policy coordination
        social:
          linkedin_url: https://www.linkedin.com/in/pema-gyamtsho-ph-d-01995b324/
    - title: Bandana Shakya
      description: Landscapes Lead, ICIMOD (Node Manager)
      background: /assets/images/bandana_shakya.jpg
      details:
        bio: Dr. Bandana Shakya coordinates ICIMOD’s work on restoring and regenerating landscapes. She leads initiatives such as springshed management, rangeland and wetland restoration, biodiversity incentives, and human-wildlife coexistence solutions.
        expertise: Landscape restoration, agroecosystem sustainability, nature-based solutions
        social:
          linkedin_url: https://www.linkedin.com/in/bandana-shakya-ph-d-9291b51a0/
    - title: Sudip Pradhan
      description: Senior Geospatial Application Development Specialist (Node Staff)
      background: /assets/images/sudip_pradhan.jpg
            details:
        bio: Sudip oversees the development of databases, geospatial applications, and information systems. He plays a key role in the SERVIR-HKH initiative, which supports environmental decision-making through satellite data and geospatial tools.
        expertise: Geospatial technology, database systems, environmental data applications
        social:
          linkedin_url: https://www.linkedin.com/in/sudip-pradhan/
    - title: Ramesh Kathariya
      description: Research Associate (Node Staff)
      background: /assets/imagesramesh_kathariya.jpg
      details:
        bio: Ramesh is an environmental science professional passionate about biodiversity conservation, data analysis, and geospatial technologies. He integrates traditional knowledge with innovative conservation practices to bridge field research, policy engagement, and community outreach.
        expertise: GIS/RS, Data analysis and visualisation, Policy review, Biodiversity metrics, community-based conservation
        email: ramesh.kathariya@icimod.org
        social:
          linkedin_url: https://www.linkedin.com/in/rameshkathariya/
          bluesky_username: ramesh-kathariya.bsky.social
          instagram_username: ramesh.kathariya
          github_username:  ramesh-kathariya # if you have an account you want to link to. Else comment this line out



couldBeAnyName:
  title: HKHBIF strategies
  description: |
     The [HKHBIF](/about) is committed to enhancing the understanding and utilisation of biodiversity information in the HKH region. Our strategies focus on several key areas:
  features:
    - title: Raise Awareness # required
      description: |      # required
        Promote understanding of biodiversity's significance in the HKH region to encourage conservation efforts.
      href: /hkhbif
      # img required
      background: /assets/images/placeholders/Raise_Awareness.jpg
      imageLicense: Ramesh Kathariya/ICIMOD
      # categories: [drawings] # optional
    - title: Global Communication # required
      description: |      # required
        Advocate for the worldwide sharing of biodiversity data to inform the public and decision-makers about its importance.
      href: /hkhbif
      background: /assets/images/placeholders/Global_Communication.jpg
      imageLicense: Ramesh Kathariya/ICIMOD
    - title: Organisational Strengthening # required
      description: |      # required
        Enhance HKHBIF's presence and expand its network of data holders and publishers to improve collaboration and data accessibility.
      href: /hkhbif
      background: /assets/images/placeholders/Organisational_Strengthening.jpg
      imageLicense: Ramesh Kathariya/ICIMOD
    - title: Partnership Development # required
      description: |      # required
        Seek collaborations with other Asian regional nodes to strengthen regional cooperation and resource sharing in biodiversity initiatives.
      href: /hkhbif
      background: /assets/images/placeholders/Partnership_Development.jpg
      imageLicense: Ramesh Kathariya/ICIMOD
    - title: Showcase Biodiversity # required
      description: |      # required
        Highlight and promote the unique biodiversity of HKH member countries to raise awareness and support for conservation efforts.
      href: /hkhbif
      background: /assets/images/placeholders/Showcase_Biodiversity.jpg
      imageLicense: Ramesh Kathariya
    - title: Open Data # required
      description: |      # required
        Encourage the publication of biodiversity data in open-access formats to facilitate global sharing and accessibility.
      href: /hkhbif
      background: /assets/images/placeholders/Open_Data.jpg
      imageLicense: Ramesh Kathariya  

herbariumImageExample:
  reverse: false
  title: "About HKHBIF"
  description: |      # required
    The Hindu Kush Himalayan Biodiversity Information Facility (HKHBIF) is dedicated to the collection, publication, and dissemination of biodiversity data from the Hindu Kush Himalayan region.
    ICIMOD is an associate member of the Global Biodiversity Information Facility (GBIF), and HKHBIF is the GBIF-mediated publishing platform that is hosted by ICIMOD. It is a regional node of GBIF that caters to ICIMOD’s eight regional member countries – Afghanistan, Bangladesh, Bhutan, China, India, Myanmar, Nepal, and Pakistan. The aim is to sensitize biodiversity data holders on the importance of biodiversity data publishing globally, build a network of data holders and publishers from the region, and motivate them to contribute to building biodiversity data for the HKH.
  # img required
  background: https://data.nhm.ac.uk/media/d9850154-9e45-426c-8712-d030da3c1c00
  imageLicense: |
    *Polyptychodon* Owen, 1841 collected in United Kingdom of Great Britain and Northern Ireland. [See full record](/specimen/search?entity=1057252794&view=TABLE) (licensed under http://creativecommons.org/licenses/by/4.0/)
  href: /about
  cta:
  - text: Download report
    href: http://example.com
    isPrimary: true
